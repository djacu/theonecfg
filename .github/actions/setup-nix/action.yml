name: 'Setup Nix'
description: |
  Installs upstream Nix and restores the /nix store cache. Used by every job
  in pull-request.yml that runs nix commands.

  Referenced as `$/.github/actions/setup-nix`, which GitHub resolves from the
  running commit without a checkout. The caller still runs `actions/checkout`
  first because the cache key hashes flake.lock from the workspace.

runs:
  using: 'composite'
  steps:
    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ hashFiles('flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-
        gc-max-store-size-linux: 5G
        purge: true
        purge-prefixes: nix-${{ runner.os }}-${{ github.job }}-
        purge-created: 0
        purge-primary-key: never
